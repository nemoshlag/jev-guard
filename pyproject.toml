[project]
name = "jev-guard"
version = "0.1.0"
description = "Local PII detection and guarding powered by jev"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "nemoshlag" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_guard*"]
