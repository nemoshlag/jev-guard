[project]
name = "jev-guard"
version = "0.1.0"
description = "Local PII detection combining regex detectors (Presidio) with a Jev/Kev classifier"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nemoshlag" }]
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "presidio-analyzer>=2.2",
    "pydantic>=2",
    "uvicorn>=0.39.0",
]

[project.scripts]
jev-guard = "jev_guard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_guard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
